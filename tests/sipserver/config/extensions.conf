; ---- IAX2 users 2001-2005 ----
exten => 2001,hint,IAX2/2001
exten => 2001,1,Gosub(dial-ext,s,1(IAX2,2001,0))
exten => 2002,hint,IAX2/2002
exten => 2002,1,Gosub(dial-ext,s,1(IAX2,2002,0))
exten => 2003,hint,IAX2/2003
exten => 2003,1,Gosub(dial-ext,s,1(IAX2,2003,0))
exten => 2004,hint,IAX2/2004
exten => 2004,1,Gosub(dial-ext,s,1(IAX2,2004,0))
exten => 2005,hint,IAX2/2005
exten => 2005,1,Gosub(dial-ext,s,1(IAX2,2005,0))

; ---- test services ----
; 600: echo
exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; 601: play a long tone (3 x 30s) to verify received audio level
exten => 601,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/tone-long)
 same => n,Playback(custom/tone-long)
 same => n,Playback(custom/tone-long)
 same => n,Hangup()
; 602: collect 4 DTMF digits (or fewer, ended with #); log to file, Verbose, AMI UserEvent
exten => 602,1,Answer()
 same => n,Set(CNUM=${FILTER(0-9A-Za-z_,${CALLERID(num)})})
 same => n,Read(DIGITS,beep,4,,1,15)
 same => n,Verbose(1,DTMF_RECEIVED from ${CNUM}: ${DIGITS})
 same => n,UserEvent(DTMFReceived,Caller: ${CNUM},Digits: ${DIGITS},Status: ${READSTATUS})
 same => n,System(echo '${DIGITS}' > /var/log/asterisk/dtmf_${CNUM}.txt)
 same => n,System(echo "$(date +%FT%T) ${CNUM} '${DIGITS}'" >> /var/log/asterisk/dtmf_all.log)
 same => n,Wait(1)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()
; 603: short call
exten => 603,1,Answer()
 same => n,Wait(2)
 same => n,Hangup()
; 604: continuous audio (hold tests)
exten => 604,1,Answer()
 same => n,MusicOnHold(default,3600)
 same => n,Hangup()
; 700 (park) / 701-720 (parked slots) come from res_parking via "include => parkedcalls"
; *8 group pickup, **XXXX directed pickup (callee must be ringing; pickup group "sales" for 1001-1010)
exten => *8,1,Pickup()
 same => n,Hangup()
exten => _**XXXX,1,Pickup(${EXTEN:2}@PICKUPMARK)
 same => n,Hangup()
; 800: conference
exten => 800,1,Answer()
 same => n,ConfBridge(800)
 same => n,Hangup()
; voicemail
exten => *97,1,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default,s)
 same => n,Hangup()
exten => *98,1,Answer()
 same => n,VoiceMailMain(@default)
 same => n,Hangup()
; 1999: prompt, then the PBX sends REFER to the caller (Refer-To 600) -> tests incoming REFER handling
exten => 1999,1,Answer()
 same => n,Playback(custom/tone-short)
 same => n,Transfer(PJSIP/sip:600@@EXT_ADDR@)
 same => n,Playback(vm-goodbye)
 same => n,Hangup()
; 1998XXXX: intercom to XXXX, callee gets Call-Info answer-after=0 / Alert-Info auto-answer
exten => _1998XXXX,1,Gosub(dial-ext,s,1(PJSIP,${EXTEN:4},0,b(add-intercom-headers^s^1)))

; ---- SIP MESSAGE routing between endpoints ----
[messages]
exten => _X.,1,NoOp(MESSAGE from ${MESSAGE(from)} to ${EXTEN}: ${MESSAGE(body)})
 same => n,MessageSend(pjsip:${EXTEN},${MESSAGE(from)})
 same => n,NoOp(MessageSend status ${MESSAGE_SEND_STATUS})
 same => n,Hangup()
