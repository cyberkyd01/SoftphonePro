; SoftphonePro test PBX dialplan
[general]
static=yes
writeprotect=no
clearglobalvars=no

; ---- common dial subroutine: Gosub(dial-ext,s,1(TECH,EXT,VOICEMAIL_0_1[,DIAL_OPTS])) ----
[dial-ext]
exten => s,1,Set(__PICKUPMARK=${ARG2})
 same => n,Dial(${ARG1}/${ARG2},30,${ARG4})
 same => n,GotoIf($["${ARG3}" = "1" & ("${DIALSTATUS}" = "NOANSWER" | "${DIALSTATUS}" = "BUSY" | "${DIALSTATUS}" = "CHANUNAVAIL")]?vm)
 same => n,Hangup()
 same => n(vm),Voicemail(${ARG2}@default,u)
 same => n,Hangup()

; ---- pre-dial handler for intercom: adds auto-answer headers on the callee leg ----
[add-intercom-headers]
exten => s,1,Set(PJSIP_HEADER(add,Call-Info)=<sip:pbx>\;answer-after=0)
 same => n,Set(PJSIP_HEADER(add,Alert-Info)=<http://www.notused>\;info=alert-autoanswer)
 same => n,Return()

[default]
include => parkedcalls

; ---- endpoints 1001-1020 (hints for BLF / dialog-info / presence) ----
exten => 1001,hint,PJSIP/1001
exten => 1001,1,Gosub(dial-ext,s,1(PJSIP,1001,1))
exten => 1002,hint,PJSIP/1002
exten => 1002,1,Gosub(dial-ext,s,1(PJSIP,1002,1))
exten => 1003,hint,PJSIP/1003
exten => 1003,1,Gosub(dial-ext,s,1(PJSIP,1003,1))
exten => 1004,hint,PJSIP/1004
exten => 1004,1,Gosub(dial-ext,s,1(PJSIP,1004,1))
exten => 1005,hint,PJSIP/1005
exten => 1005,1,Gosub(dial-ext,s,1(PJSIP,1005,1))
exten => 1006,hint,PJSIP/1006
exten => 1006,1,Gosub(dial-ext,s,1(PJSIP,1006,1))
exten => 1007,hint,PJSIP/1007
exten => 1007,1,Gosub(dial-ext,s,1(PJSIP,1007,1))
exten => 1008,hint,PJSIP/1008
exten => 1008,1,Gosub(dial-ext,s,1(PJSIP,1008,1))
exten => 1009,hint,PJSIP/1009
exten => 1009,1,Gosub(dial-ext,s,1(PJSIP,1009,1))
exten => 1010,hint,PJSIP/1010
exten => 1010,1,Gosub(dial-ext,s,1(PJSIP,1010,1))
exten => 1011,hint,PJSIP/1011
exten => 1011,1,Gosub(dial-ext,s,1(PJSIP,1011,0))
exten => 1012,hint,PJSIP/1012
exten => 1012,1,Gosub(dial-ext,s,1(PJSIP,1012,0))
exten => 1013,hint,PJSIP/1013
exten => 1013,1,Gosub(dial-ext,s,1(PJSIP,1013,0))
exten => 1014,hint,PJSIP/1014
exten => 1014,1,Gosub(dial-ext,s,1(PJSIP,1014,0))
exten => 1015,hint,PJSIP/1015
exten => 1015,1,Gosub(dial-ext,s,1(PJSIP,1015,0))
exten => 1016,hint,PJSIP/1016
exten => 1016,1,Gosub(dial-ext,s,1(PJSIP,1016,0))
exten => 1017,hint,PJSIP/1017
exten => 1017,1,Gosub(dial-ext,s,1(PJSIP,1017,0))
exten => 1018,hint,PJSIP/1018
exten => 1018,1,Gosub(dial-ext,s,1(PJSIP,1018,0))
exten => 1019,hint,PJSIP/1019
