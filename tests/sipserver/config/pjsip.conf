; SoftphonePro test PBX - PJSIP. "@EXT_ADDR@" is substituted by entrypoint.sh
[global]
type=global
user_agent=SoftphonePro-TestPBX
endpoint_identifier_order=username,ip,anonymous

; ---------- Transports ----------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=@EXT_ADDR@
external_signaling_address=@EXT_ADDR@

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=@EXT_ADDR@
external_signaling_address=@EXT_ADDR@

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key
ca_list_file=/etc/asterisk/keys/ca.crt
method=sslv23
verify_client=no
verify_server=no
external_media_address=@EXT_ADDR@
external_signaling_address=@EXT_ADDR@

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0
external_media_address=@EXT_ADDR@
external_signaling_address=@EXT_ADDR@

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
external_media_address=@EXT_ADDR@
external_signaling_address=@EXT_ADDR@

; ---------- Templates ----------
[tpl-endpoint](!)
type=endpoint
context=default
disallow=all
allow=ulaw,alaw,g722,opus,gsm,ilbc,speex,g729
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
dtmf_mode=rfc4733
allow_subscribe=yes
send_pai=yes
send_rpid=yes
trust_id_outbound=yes
message_context=messages
language=en
moh_suggest=default
allow_transfer=yes
device_state_busy_at=1
callerid_tag=SoftphonePro

[tpl-aor](!)
type=aor
max_contacts=5
remove_existing=yes
minimum_expiration=10
default_expiration=3600
maximum_expiration=7200
qualify_frequency=0

[tpl-auth](!)
type=auth
auth_type=userpass

[tpl-pickup](!)
named_call_group=sales
named_pickup_group=sales

[1001](tpl-endpoint,tpl-pickup)
auth=1001
aors=1001
mailboxes=1001@default
subscribe_context=default

[1001](tpl-aor)

[1001](tpl-auth)
