name: CI

# Builds + tests everything. Also reusable: release.yml calls this workflow (workflow_call) and
# attaches the produced artifacts to a GitHub Release.
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.32.1'
  NDK_VERSION: '27.0.12077973'

jobs:
  # ---------------------------------------------------------------------------------------------
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_name: ${{ steps.v.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          base="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' app/pubspec.yaml | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            build_name="${version%%-*}"
          else
            version="${base}-dev.${GITHUB_RUN_NUMBER}"
            build_name="$base"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "Version: $version (flutter build-name $build_name)"

  # ---------------------------------------------------------------------------------------------
  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config perl python3 libasound2-dev uuid-dev
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/linux-x86_64
            native/deps/src
          key: deps-linux-x86_64-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: native/scripts/build_deps_linux.sh --no-docker
      - name: Build spcore + spcore_cli (test build with test hooks)
        env:
          SPC_TEST_HOOKS: "ON"      # needed by native/tests/test_voice_isolation.py; shipped app builds keep it OFF
        run: native/scripts/build_spcore.sh linux
      - name: Start test PBX (Asterisk)
        run: tests/sipserver/scripts/up.sh
      - name: Engine tests (C)
        if: hashFiles('native/tests/run_tests.py') != ''
        env:
          SPCORE_LIB: ${{ github.workspace }}/native/build/linux/libspcore.so
          SPCORE_CLI: ${{ github.workspace }}/native/build/linux/spcore_cli
          PBX_HOST: 127.0.0.1
        run: python3 native/tests/run_tests.py 2>&1 | tee native-tests.log
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: spcore_dart tests (unit + integration against the PBX)
        working-directory: packages/spcore_dart
        env:
          SPCORE_LIB: ${{ github.workspace }}/native/build/linux/libspcore.so
          PBX_HOST: 127.0.0.1
        run: |
          dart pub get
          dart test 2>&1 | tee ../../spcore_dart-tests.log
      - name: lan_link tests
        working-directory: packages/lan_link
        run: |
          dart pub get
          dart test 2>&1 | tee ../../lan_link-tests.log
      - name: Collect PBX logs
        if: always()
        run: |
          mkdir -p logs
          docker logs softphonepro-pbx > logs/pbx.log 2>&1 || true
          mv -f ./*.log logs/ 2>/dev/null || true
          cp -r native/build/linux/Testing logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-test-logs
          path: logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: spcore-linux
          path: |
            native/build/linux/libspcore.so
            native/build/linux/spcore_cli
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Pub get (path dependencies included)
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test
      - name: Analyze + test spcore_dart / lan_link
        run: |
          for p in packages/spcore_dart packages/lan_link; do
            (cd "$p" && dart pub get && dart analyze && dart test --exclude-tags integration)
          done

  # ---------------------------------------------------------------------------------------------
  android:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build perl
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/android-arm64-v8a
            native/out/android-armeabi-v7a
            native/out/android-x86_64
            native/deps/src
          key: deps-android-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: native/scripts/build_deps_android.sh all
      - name: Build spcore (3 ABIs)
        run: native/scripts/build_spcore.sh android
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            {
              echo "storePassword=$KS_PASS"
              echo "keyPassword=$KEY_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$RUNNER_TEMP/release.jks"
            } > app/android/key.properties
            echo "Using release keystore."
          else
            echo "No keystore secrets: APKs are signed with the debug key."
          fi
      - name: Build APKs
        working-directory: app
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD_NAME: ${{ needs.meta.outputs.build_name }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER"
          flutter build apk --release --build-name "$BUILD_NAME" --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "../dist/SoftphonePro-$VERSION-android-$abi.apk"
          done
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/SoftphonePro-$VERSION-android-universal.apk"
      - name: Verify native lib packaging and 16 KB alignment
        run: |
          zipalign="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)"
          for f in dist/*-universal.apk; do
            unzip -l "$f" | grep libspcore.so
            "$zipalign" -c -P 16 -v 4 "$f" | grep -E 'libspcore|Verification'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk

  # ---------------------------------------------------------------------------------------------
  android-smoke:
    continue-on-error: true
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke - x86_64 emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: tests/smoke/android_smoke.sh "$(ls apks/*-android-x86_64.apk | head -1)" smoke-logs/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: smoke-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  windows:
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/windows-x64
            native/deps/src
          key: deps-windows-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./native/scripts/build_deps_windows.ps1
      - name: Build spcore.dll
        shell: pwsh
        run: ./native/scripts/build_spcore_windows.ps1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Flutter Windows app
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release --build-name "${{ needs.meta.outputs.build_name }}" --build-number "$env:GITHUB_RUN_NUMBER"
          if (-not (Test-Path build\windows\x64\runner\Release\spcore.dll)) { throw 'spcore.dll missing from the bundle' }
      - name: Installer (Inno Setup) + portable ZIP
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { 'iscc' } else { "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = (Resolve-Path dist).Path
          & $iscc "/DAppVersion=$env:VERSION" "/DOutputDir=$out" app\windows\installer\softphonepro.iss
          if ($LASTEXITCODE -ne 0) { throw 'iscc failed' }
          Compress-Archive -Path app\build\windows\x64\runner\Release\* -DestinationPath "dist\SoftphonePro-$env:VERSION-windows-x64-portable.zip"
          Get-ChildItem dist
      - name: Smoke - run the built exe (provision, automation API, DND)
        shell: pwsh
        run: ./tests/smoke/windows_smoke.ps1 -Exe app\build\windows\x64\runner\Release\softphonepro.exe -OutDir smoke-logs\portable -ExpectedVersion '${{ needs.meta.outputs.build_name }}'
      - name: Smoke - silent install, protocol handlers, run installed exe, uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\SoftphonePro-Setup-*-x64.exe | Select-Object -First 1).FullName
          ./tests/smoke/windows_installer_smoke.ps1 -Installer $setup -OutDir smoke-logs\installer -ExpectedVersion '${{ needs.meta.outputs.build_name }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist/*

  # ---------------------------------------------------------------------------------------------
  macos:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install build tools
        run: brew install ninja cmake || true
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/macos-arm64
            native/out/macos-x86_64
            native/deps/src
          key: deps-macos-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      - name: Build native dependencies (arm64 + x86_64)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: native/scripts/build_deps_macos.sh all
      - name: Build spcore.xcframework (universal)
        run: native/scripts/build_spcore.sh macos
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Flutter macOS app
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release --build-name "${{ needs.meta.outputs.build_name }}" --build-number "$GITHUB_RUN_NUMBER"
          test -d build/macos/Build/Products/Release/softphonepro.app/Contents/Frameworks/spcore.framework
      - name: Smoke - launch the built .app with --provision and drive the automation API
        run: python3 tests/smoke/macos_smoke.py --app app/build/macos/Build/Products/Release/softphonepro.app --out smoke-logs/macos --version "${{ needs.meta.outputs.build_name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-logs
          path: smoke-logs/
          if-no-files-found: ignore
      - name: DMG (ad-hoc signed, or Developer ID + notarized when secrets exist)
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: app/macos/packaging/make_dmg.sh "${{ needs.meta.outputs.version }}" app/build/macos/Build/Products/Release/softphonepro.app dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  # ---------------------------------------------------------------------------------------------
  # Linux desktop app (.deb + .tar.gz), built natively on each architecture. Ubuntu 22.04 (glibc 2.35) is the
  # baseline so the packages install on Ubuntu 22.04/24.04, Debian 12/13 and Raspberry Pi OS Bookworm.
  # ubuntu-22.04-arm = GitHub's free arm64 hosted runner (public repositories).
  linux:
    name: linux-${{ matrix.arch }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04, native: x86_64 }
          - { arch: arm64, runner: ubuntu-22.04-arm, native: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      BUILD_NAME: ${{ needs.meta.outputs.build_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (same list as native/scripts/docker/Dockerfile.linux-app)
        run: |
          sudo apt-get update
          # GitHub's ubuntu-22.04 images preinstall libunwind-14-dev, which conflicts with the libunwind-dev
          # that libgstreamer1.0-dev depends on. Harmless when the package is absent (e.g. the arm64 image).
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config ninja-build perl curl ca-certificates git file unzip xz-utils zip \
            python3 python3-pip rsync patchelf \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libsecret-1-dev \
            libayatana-appindicator3-dev libnotify-dev libkeybinder-3.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev uuid-dev \
            dpkg-dev fakeroot lintian desktop-file-utils appstream imagemagick librsvg2-bin \
            xvfb dbus-x11 jq
      - name: CMake >= 3.28 (pjproject 2.17 needs it; the image may ship an older one)
        run: |
          if ! cmake --version 2>/dev/null | head -1 | awk '{split($3,v,"."); exit !(v[1]>3 || (v[1]==3 && v[2]>=28))}'; then
            python3 -m pip install --user --no-cache-dir 'cmake==3.31.*'
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          cmake --version
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/linux-${{ matrix.native }}
            native/deps/src
          key: deps-linux-app-${{ matrix.arch }}-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      # amd64: the same action as every other job.
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'amd64'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # arm64: flutter-action only installs the x64 Linux SDK archive (Flutter publishes no arm64 Linux archive;
      # an arm64 host builds the SDK's engine artifacts on first use), so use a pinned git checkout instead.
      - name: Flutter SDK cache (arm64)
        if: matrix.arch == 'arm64'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ~/flutter-sdk
          key: flutter-sdk-linux-arm64-${{ env.FLUTTER_VERSION }}
      - name: Flutter SDK (arm64, git checkout)
        if: matrix.arch == 'arm64'
        run: |
          if [ ! -x "$HOME/flutter-sdk/bin/flutter" ]; then
            git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
          fi
          echo "$HOME/flutter-sdk/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter-sdk/bin:$PATH"
          git config --global --add safe.directory '*'
          flutter config --no-analytics --enable-linux-desktop
          flutter precache --linux
      - name: Flutter version
        run: flutter --version
      - name: Build packages (.deb + .tar.gz)
        run: app/linux/packaging/build_linux.sh --arch ${{ matrix.arch }} --version "$VERSION" --build-number "$GITHUB_RUN_NUMBER" --out dist
      - name: Package list
        run: ls -la dist && dpkg-deb -I dist/*.deb | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/SoftphonePro-*-linux-${{ matrix.arch }}.deb
            dist/SoftphonePro-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      # ---- install tests: clean containers of this runner's architecture ----------------------------------
      - name: "Install test (debian:12, ubuntu:22.04, ubuntu:24.04, debian:13)"
        shell: bash
        run: |
          rc=0
          for img in debian:12 ubuntu:22.04 ubuntu:24.04 debian:13; do
            echo "::group::$img"
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/tests/smoke:/smoke:ro" "$img" bash /smoke/linux_install_check.sh 2>&1 | tee -a install-check.log || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # ---- runtime smoke ------------------------------------------------------------------------------------
      - name: Install the .deb on the runner (lean, no Recommends)
        run: sudo apt-get install -y --no-install-recommends ./dist/SoftphonePro-*-linux-${{ matrix.arch }}.deb
      - name: Docker available for the test PBX?
        id: docker
        run: |
          if docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker / docker compose is not available on this ${{ matrix.arch }} runner: the PBX part of the Linux smoke test is SKIPPED"
          fi
      - name: Start test PBX (Asterisk)
        if: steps.docker.outputs.ok == 'true'
        run: tests/sipserver/scripts/up.sh
      - name: Smoke - provision, automation API, register, call + DTMF, single instance (Xvfb + private D-Bus session)
        shell: bash
        env:
          NO_PBX: ${{ steps.docker.outputs.ok != 'true' && '--no-pbx' || '' }}
        run: |
          mkdir -p smoke-logs/linux
          # NO_PBX is empty or a single flag, so it is deliberately unquoted
          # shellcheck disable=SC2086
          xvfb-run -a -s '-screen 0 1280x1024x24' dbus-run-session -- \
            python3 tests/smoke/linux_smoke.py --out smoke-logs/linux --version "$BUILD_NAME" $NO_PBX 2>&1 | tee smoke-logs/linux/smoke.log
          exit "${PIPESTATUS[0]}"
      - name: Collect logs
        if: always()
        run: |
          mkdir -p smoke-logs
          cp install-check.log smoke-logs/ 2>/dev/null || true
          docker logs softphonepro-pbx > smoke-logs/pbx.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-${{ matrix.arch }}
          path: smoke-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  ios:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install build tools
        run: brew install ninja cmake || true
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/ios-arm64
            native/out/ios-sim-arm64
            native/out/ios-sim-x86_64
            native/deps/src
          key: deps-ios-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      - name: Build native dependencies (device + simulators)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: native/scripts/build_deps_ios.sh all
      - name: Build spcore.xcframework
        run: native/scripts/build_spcore.sh ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Flutter iOS app (unsigned)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --build-name "${{ needs.meta.outputs.build_name }}" --build-number "$GITHUB_RUN_NUMBER"
      - name: Package unsigned IPA
        run: |
          mkdir -p dist ipa/Payload
          cp -R app/build/ios/iphoneos/Runner.app ipa/Payload/
          (cd ipa && zip -qry "../dist/SoftphonePro-${{ needs.meta.outputs.version }}-unsigned.ipa" Payload)
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa

  # ---------------------------------------------------------------------------------------------
  # Simulator smoke on an Intel runner: the app's simulator build is x86_64-only (Google ML Kit pods ship
  # no arm64 simulator slice) and x86_64 apps do not launch in the simulator on the arm64 runners.
  ios-sim-smoke:
    needs: [meta, ios]
    continue-on-error: true  # informational until the simulator path is proven stable
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install build tools
        run: brew install ninja cmake || true
      - name: Cache native dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            native/out/ios-arm64
            native/out/ios-sim-arm64
            native/out/ios-sim-x86_64
            native/deps/src
          key: deps-ios-${{ hashFiles('native/scripts/**', 'native/config/**', '!native/scripts/build_spcore*', '!native/scripts/package/**') }}
      - name: Build native dependencies (device + simulators)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: native/scripts/build_deps_ios.sh all
      - name: Build spcore.xcframework
        run: native/scripts/build_spcore.sh ios
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build Flutter iOS app for the simulator (debug)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --simulator --debug --config-only --build-name "${{ needs.meta.outputs.build_name }}" --build-number "$GITHUB_RUN_NUMBER"
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/ios/sim-dd build > xcodebuild.log 2>&1 || { grep -E "error:|warning: .*mobile_scanner" xcodebuild.log | head -40; tail -n 40 xcodebuild.log; exit 1; }
          cp -R build/ios/sim-dd/Build/Products/Debug-iphonesimulator/Runner.app build/ios/Runner.app
          lipo -archs build/ios/Runner.app/Runner
      - name: Smoke - boot simulator, install, launch, screenshot
        run: tests/smoke/ios_sim_smoke.sh app/build/ios/Runner.app smoke-logs/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: smoke-logs/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  browser-extension:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint (syntax + manifest validation)
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build Chrome + Firefox packages
        env:
          EXT_VERSION: ${{ needs.meta.outputs.version }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: extensions/browser/dist/*.zip
          if-no-files-found: error
