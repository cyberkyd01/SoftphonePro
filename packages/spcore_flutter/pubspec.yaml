name: spcore_flutter
description: "Bundles the prebuilt SoftphonePro C engine (libspcore) for Android, iOS, macOS, Windows and Linux. Loading logic lives in spcore_dart."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
